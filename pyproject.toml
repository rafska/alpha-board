[project]
name = "alpha-board"
version = "0.0.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "commitizen==4.10.0",
    "pre-commit==4.2.0",
    "ruff==0.14.5",
    "shellcheck-py==0.11.0.1",
    "ty==0.0.1a26",
]

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "$version"
version_scheme = "pep440"
version_provider = "uv"
update_changelog_on_bump = true
major_version_zero = true
